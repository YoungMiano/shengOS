<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#145C45"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- geometric banded pattern along the bottom, evoking East African textile
       stripes without reproducing any specific existing artwork -->
  <g opacity="0.9">
    <rect x="0" y="900" width="1920" height="18" fill="#E4B13B"/>
    <rect x="0" y="930" width="1920" height="10" fill="#C0392B"/>
    <rect x="0" y="952" width="1920" height="18" fill="#1A1A1A"/>
    <rect x="0" y="982" width="1920" height="10" fill="#E4B13B"/>
    <rect x="0" y="1004" width="1920" height="18" fill="#C0392B"/>
  </g>

  <!-- repeating diamond motif strip -->
  <g>
    <polygon points="30,860 60,890 30,920 0,890" fill="#E4B13B"/>
    <polygon points="150,860 180,890 150,920 120,890" fill="#E4B13B"/>
    <polygon points="270,860 300,890 270,920 240,890" fill="#E4B13B"/>
    <polygon points="390,860 420,890 390,920 360,890" fill="#E4B13B"/>
    <polygon points="510,860 540,890 510,920 480,890" fill="#E4B13B"/>
    <polygon points="630,860 660,890 630,920 600,890" fill="#E4B13B"/>
    <polygon points="750,860 780,890 750,920 720,890" fill="#E4B13B"/>
    <polygon points="870,860 900,890 870,920 840,890" fill="#E4B13B"/>
    <polygon points="990,860 1020,890 990,920 960,890" fill="#E4B13B"/>
    <polygon points="1110,860 1140,890 1110,920 1080,890" fill="#E4B13B"/>
    <polygon points="1230,860 1260,890 1230,920 1200,890" fill="#E4B13B"/>
    <polygon points="1350,860 1380,890 1350,920 1320,890" fill="#E4B13B"/>
    <polygon points="1470,860 1500,890 1470,920 1440,890" fill="#E4B13B"/>
    <polygon points="1590,860 1620,890 1590,920 1560,890" fill="#E4B13B"/>
    <polygon points="1710,860 1740,890 1710,920 1680,890" fill="#E4B13B"/>
    <polygon points="1830,860 1860,890 1830,920 1800,890" fill="#E4B13B"/>
  </g>

  <!-- soft circular accent, evoking a rising sun -->
  <circle cx="1600" cy="260" r="140" fill="#E4B13B" opacity="0.18"/>
  <circle cx="1600" cy="260" r="90" fill="#E4B13B" opacity="0.25"/>

  <!-- wordmark -->
  <text x="120" y="500" font-family="'Ubuntu', 'Noto Sans', sans-serif" font-size="96" font-weight="700" fill="#F5EFE0">ShengOS</text>
  <text x="122" y="560" font-family="'Ubuntu', 'Noto Sans', sans-serif" font-size="34" fill="#E4B13B">Karibu. Mfumo wako, lugha yako.</text>
</svg>
